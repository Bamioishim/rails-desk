# To enable: copy this file to .github/workflows/kane-gate.yml (needs a GitHub login with workflow permission),
# then add repository secrets LT_USERNAME and LT_ACCESS_KEY.
name: Kane gate

# Kane is a paid browser-testing service. Run only by an explicit workflow dispatch.
# Needs repository secrets LT_USERNAME and LT_ACCESS_KEY (Settings → Secrets and variables → Actions).
# Without them the job skips with a notice instead of failing.

on:
  workflow_dispatch:

concurrency:
  group: rails-desk-kane-gate
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  kane-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LT_USERNAME: ${{ secrets.LT_USERNAME }}
      LT_ACCESS_KEY: ${{ secrets.LT_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Install Kane CLI
        if: env.LT_USERNAME != '' && env.LT_ACCESS_KEY != ''
        run: npm install -g @testmuai/kane-cli@0.10.6
      - name: Kane gate
        run: npm run kane:gate:ci
      - name: Kane report to job summary
        if: always()
        run: |
          if [ -f KANE_REPORT.md ]; then cat KANE_REPORT.md >> "$GITHUB_STEP_SUMMARY"; else echo "Kane gate skipped (no LT secrets)." >> "$GITHUB_STEP_SUMMARY"; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kane-report
          path: |
            KANE_REPORT.md
            .kane/
          if-no-files-found: ignore
