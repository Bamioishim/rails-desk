name: Production Redis smoke test

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - "next.config.ts"
      - "scripts/verify-production-redis.mjs"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-redis:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Wait for the HttpOnly-session release to reach production
        run: |
          for i in $(seq 1 60); do
            status=$(curl -s -o /dev/null -w "%{http_code}" https://rails-desk.vercel.app/api/v1/session || true)
            if [ "$status" = "200" ]; then exit 0; fi
            sleep 5
          done
          echo "The new session endpoint did not reach production." >&2
          exit 1
      - name: Verify real production Redis persistence
        run: npm run verify:production
