# Active copy of ci/kane-gate.yml. Runs on pull requests and on demand (Actions → Kane gate → Run workflow).
# Runs on pull requests and main so the merged commit receives its own fresh gate result.
name: Kane gate

# Runs the Kane CLI browser tests against a fresh build of this PR and fails the check
# (blocking merge/deploy when branch protection requires it) if any Kane flow fails.
# Needs repository secrets LT_USERNAME and LT_ACCESS_KEY (Settings → Secrets and variables → Actions).
# Missing secrets fail the job. A skipped run is not a passing gate.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: rails-desk-kane-gate-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

jobs:
  kane-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LT_USERNAME: ${{ secrets.LT_USERNAME }}
      LT_ACCESS_KEY: ${{ secrets.LT_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Cancel superseded Kane gate runs
        if: github.ref == 'refs/heads/main'
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: "kane-gate.yml",
              per_page: 100,
            });
            for (const run of data.workflow_runs) {
              if (run.id === context.runId || run.status !== "in_progress") continue;
              await github.rest.actions.cancelWorkflowRun({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: run.id,
              });
              core.info(`Cancelled superseded Kane run ${run.id} on ${run.head_branch}`);
            }
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Install Kane CLI
        run: npm install -g @testmuai/kane-cli@0.10.6
      - name: Kane gate
        run: npm run kane:gate:ci
      - name: Kane report to job summary
        if: always()
        run: |
          if [ -f KANE_REPORT.md ]; then cat KANE_REPORT.md >> "$GITHUB_STEP_SUMMARY"; else echo "KANE GATE REPORT MISSING: this job is not verified." >> "$GITHUB_STEP_SUMMARY"; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kane-report
          path: |
            KANE_REPORT.md
            .kane/
          if-no-files-found: ignore
